<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 视频提示词生成工具</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0f1117;
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
}

/* 左侧 Logo 区 */
.login-left {
  flex: 1;
  background: #12141c;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  border-right: 1px solid #2a2d38;
  position: relative;
  overflow: hidden;
}
.login-left::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 40%, rgba(45,90,240,0.15) 0%, transparent 70%);
  pointer-events: none;
}
.login-logo-wrap {
  width: 160px;
  height: 160px;
  border-radius: 40px;
  background: #1a1d27;
  border: 2px solid #2a2d38;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(45,90,240,0.2);
}
.login-logo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}
.login-logo-placeholder {
  font-size: 64px;
  color: #2d5af0;
}
.login-left h2 {
  font-size: 22px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 8px;
  text-align: center;
}
.login-left p {
  font-size: 13px;
  color: #888;
  text-align: center;
}

/* 右侧表单区 */
.login-right {
  width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 48px;
}
.login-right h1 {
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 32px;
  align-self: flex-start;
}
.form-group {
  width: 100%;
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #999;
  margin-bottom: 8px;
}
.form-group input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid #2a2d38;
  border-radius: 10px;
  background: #12141c;
  color: #e0e0e0;
  font-size: 14px;
  font-family: inherit;
  transition: border-color .2s;
}
.form-group input:focus {
  outline: none;
  border-color: #2d5af0;
}
.form-group input::placeholder {
  color: #555;
}

.btn-login {
  width: 100%;
  padding: 14px;
  background: #2d5af0;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  margin-top: 8px;
  transition: background .2s;
}
.btn-login:hover { background: #3b66f5; }
.btn-login:disabled { background: #333; color: #666; cursor: not-allowed; }

.error-msg {
  width: 100%;
  background: rgba(239,68,68,0.12);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  color: #ef4444;
  margin-bottom: 16px;
  display: none;
}
.success-msg {
  width: 100%;
  background: rgba(34,197,94,0.12);
  border: 1px solid rgba(34,197,94,0.3);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  color: #22c55e;
  margin-bottom: 16px;
  display: none;
}

/* 响应式：移动端左右叠放 */
@media (max-width: 768px) {
  body { flex-direction: column; }
  .login-left { min-height: 220px; border-right: none; border-bottom: 1px solid #2a2d38; }
  .login-right { width: 100%; padding: 40px 24px; }
}
</style>
</head>
<body>

<!-- 左侧 Logo 区 -->
<div class="login-left">
  <div class="login-logo-wrap">
    <img id="logoImg" src="" alt="Logo">
    <span class="login-logo-placeholder">🎬</span>
  </div>
  <h2>视频提示词生成工具</h2>
  <p>AI 赋能 · 高效创作</p>
</div>

<!-- 右侧登录表单 -->
<div class="login-right">
  <h1>账号登录</h1>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <div class="form-group">
    <label>账号</label>
    <input type="text" id="username" placeholder="请输入账号（最多8位）" maxlength="8" autocomplete="off">
  </div>

  <div class="form-group">
    <label>密码</label>
    <input type="password" id="password" placeholder="请输入密码（至少6位）" minlength="6">
  </div>

  <button class="btn-login" id="loginBtn" onclick="doLogin()">登 录</button>
</div>

<script>
const $ = id => document.getElementById(id);

function showError(msg) {
  const el = $('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  $('successMsg').style.display = 'none';
}
function showSuccess(msg) {
  const el = $('successMsg');
  el.textContent = msg;
  el.style.display = 'block';
  $('errorMsg').style.display = 'none';
}
function clearMsg() {
  $('errorMsg').style.display = 'none';
  $('successMsg').style.display = 'none';
}

async function doLogin() {
  const username = $('username').value.trim();
  const password = $('password').value;
  const btn = $('loginBtn');

  clearMsg();

  if (!username) { showError('请输入账号'); return; }
  if (!password) { showError('请输入密码'); return; }
  if (username.length > 8) { showError('账号长度不能超过8位'); return; }
  if (password.length < 6) { showError('密码长度不能少于6位'); return; }

  btn.disabled = true;
  btn.textContent = '登录中...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || '登录失败'); return; }
    showSuccess('登录成功，即将跳转...');
    setTimeout(() => { window.location.href = '/admin.html'; }, 500);
  } catch (e) {
    showError('网络异常，请稍后重试');
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

// 回车登录
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('username').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// 检查是否已登录，已登录则直接跳转
(async () => {
  try {
    const res = await fetch('/api/auth/me');
    if (res.ok) window.location.href = '/admin.html';
  } catch (_) {}
})();
</script>
</body>
</html>
