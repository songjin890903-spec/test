<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号管理 - 视频提示词生成工具</title>
<link rel="stylesheet" href="/components/layout.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div id="layoutContainer"></div>

<!-- 共享布局组件 -->
<script src="/components/layout.js"></script>

<!-- 弹窗 -->
<div class="modal-overlay" id="modalChangePwd">
  <div class="modal">
    <h3>🔑 修改我的密码</h3>
    <div class="form-group"><label>旧密码</label><input type="password" id="modalOldPwd" placeholder="请输入当前密码" minlength="6"></div>
    <div class="form-group"><label>新密码 <span style="color:#555;font-weight:400;">（至少6位）</span></label><input type="password" id="modalNewPwd" placeholder="输入新密码" minlength="6"></div>
    <div class="form-group"><label>确认新密码</label><input type="password" id="modalNewPwd2" placeholder="再次输入新密码" minlength="6"></div>
    <div id="modalChangePwdStatus"></div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="doChangePassword()">确认修改</button>
      <button class="btn btn-outline" onclick="closeModal('modalChangePwd')">取消</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalAddUser">
  <div class="modal">
    <h3>➕ 新增账号</h3>
    <div class="form-group"><label>账号 <span style="color:#555;font-weight:400;">（最多15位，不允许重复）</span></label><input type="text" id="addUsername" placeholder="输入账号" maxlength="15" autocomplete="off"></div>
    <div class="form-group"><label>姓名 <span style="color:#555;font-weight:400;">（最多20位）</span></label><input type="text" id="addName" placeholder="输入姓名（可选）" maxlength="20"></div>
    <div class="form-group"><label>密码 <span style="color:#555;font-weight:400;">（至少6位）</span></label><input type="password" id="addPassword" placeholder="输入密码" minlength="6"></div>
    <div id="modalAddUserStatus"></div>
    <div class="btn-group">
      <button class="btn btn-success" onclick="doAddUser()">确认创建</button>
      <button class="btn btn-outline" onclick="closeModal('modalAddUser')">取消</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalResetPwd">
  <div class="modal">
    <h3>🔑 修改账号信息</h3>
    <p style="font-size:13px;color:#888;margin-bottom:16px;">正在修改账号 <strong id="resetPwdUsername" style="color:#fff;"></strong></p>
    <div class="form-group"><label>姓名 <span style="color:#555;font-weight:400;">（最多20位）</span></label><input type="text" id="resetName" placeholder="输入姓名（可选，留空则清除）" maxlength="20"></div>
    <div class="form-group"><label>新密码 <span style="color:#555;font-weight:400;">（至少6位）</span></label><input type="password" id="resetPassword" placeholder="输入新密码" minlength="6"></div>
    <div id="modalResetPwdStatus"></div>
    <div class="btn-group">
      <button class="btn btn-success" onclick="doResetPassword()">确认修改</button>
      <button class="btn btn-outline" onclick="closeModal('modalResetPwd')">取消</button>
    </div>
  </div>
</div>

<script>
let currentUser = null, currentResetUserId = null;

(async function init() {
  renderLayout('layoutContainer', 'account');
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) { window.location.href = '/login.html'; return; }
    currentUser = await res.json();
    renderUserInfo();
    loadUserList();
  } catch (_) { window.location.href = '/login.html'; }
})();

function renderUserInfo() {
  const content = document.getElementById('mainContent');
  if (!content) return;
  content.innerHTML = `
    <div class="page-content">
      <div class="page-title">👤 账号管理</div>
      <p class="page-subtitle">管理员可增删改账号，普通用户仅可修改自己的密码</p>

      <div class="card">
        <div class="card-title">🔑 修改我的密码</div>
        <div class="form-row">
          <div><label>旧密码</label><input type="password" id="oldPwd" placeholder="请输入当前密码" minlength="6"></div>
          <div><label>新密码</label><input type="password" id="newPwd" placeholder="新密码（至少6位）" minlength="6"></div>
        </div>
        <div id="pwdChangeStatus"></div>
        <div class="btn-group"><button class="btn btn-primary btn-sm" onclick="changeMyPassword()">确认修改</button></div>
      </div>

      <div class="card" id="adminUserPanel" style="display:none;">
        <div class="card-title">🛡️ 后台账号管理 <span style="font-size:11px;color:#555;font-weight:400;">（仅管理员可见）</span></div>
        <div class="btn-group" style="margin-bottom:14px;"><button class="btn btn-primary btn-sm" onclick="openAddUserModal()">+ 新增账号</button></div>
        <div id="userTableStatus"></div>
        <div class="user-table-wrap">
          <table class="user-table">
            <thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>创建时间</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="userTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  document.getElementById('userName').textContent = currentUser.username;
  document.getElementById('userAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
  const el = document.getElementById('userRole');
  if (currentUser.isAdmin) {
    el.textContent = '管理员'; el.className = 'user-role admin';
    document.getElementById('adminUserPanel').style.display = 'block';
  } else {
    el.textContent = '普通用户'; el.className = 'user-role';
  }
}

function openChangePassword() {
  document.getElementById('userDropdown').classList.remove('show');
  ['modalOldPwd','modalNewPwd','modalNewPwd2'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('modalChangePwdStatus').innerHTML = '';
  document.getElementById('modalChangePwd').classList.add('show');
}
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

async function doChangePassword() {
  const oldPwd = document.getElementById('modalOldPwd').value;
  const newPwd = document.getElementById('modalNewPwd').value;
  const newPwd2 = document.getElementById('modalNewPwd2').value;
  const el = document.getElementById('modalChangePwdStatus');
  if (!oldPwd || !newPwd) { el.innerHTML = '<div class="status status-error">请填写所有字段</div>'; return; }
  if (newPwd.length < 6) { el.innerHTML = '<div class="status status-error">新密码长度不能少于6位</div>'; return; }
  if (newPwd !== newPwd2) { el.innerHTML = '<div class="status status-error">两次新密码不一致</div>'; return; }
  try {
    const res = await fetch('/api/auth/change-password', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({oldPassword:oldPwd,newPassword:newPwd})});
    const d = await res.json();
    if (!res.ok) { el.innerHTML = '<div class="status status-error">'+(d.error||'修改失败')+'</div>'; return; }
    el.innerHTML = '<div class="status status-success">密码修改成功！</div>';
    setTimeout(() => closeModal('modalChangePwd'), 800);
  } catch (_) { el.innerHTML = '<div class="status status-error">网络异常</div>'; }
}

async function loadUserList() {
  if (!currentUser?.isAdmin) return;
  const se = document.getElementById('userTableStatus');
  const tb = document.getElementById('userTableBody');
  se.innerHTML = '<div class="status status-info">加载中...</div>';
  try {
    const res = await fetch('/api/admin/users');
    if (!res.ok) { se.innerHTML = '<div class="status status-error">加载失败</div>'; return; }
    const d = await res.json();
    se.innerHTML = '';
    const users = d.users || [];
    if (!users.length) { tb.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#555;">暂无账号</td></tr>'; return; }
    tb.innerHTML = users.map(u => {
      const del = !!u.is_deleted, admin = !!u.is_admin;
      return '<tr><td>'+u.username+'</td><td>'+(u.name||'-')+'</td><td><span class="badge '+(admin?'badge-admin':'badge-normal')+'">'+(admin?'管理员':'普通用户')+'</span></td><td>'+((u.created_at||'').slice(0,16).replace('T',' '))+'</td><td>'+(del?'<span class="badge badge-deleted">已删除</span>':'<span class="check-item check-ok">正常</span>')+'</td><td style="display:flex;gap:6px;align-items:center;">'+(del?'':'<button class="btn btn-outline btn-sm" onclick="openResetPwdModal('+u.id+',\''+u.username+'\',\''+(u.name||'')+'\')">修改</button>')+(!del&&u.id!==currentUser?.userId?' <button class="btn btn-danger btn-sm" onclick="deleteUser('+u.id+')">删除</button>':'')+(del?' <span style="font-size:11px;color:#555;">已软删除</span>':'')+'</td></tr>';
    }).join('');
  } catch (_) { se.innerHTML = '<div class="status status-error">加载失败</div>'; }
}

function openAddUserModal() { ['addUsername','addPassword','addName'].forEach(id=>document.getElementById(id).value=''); document.getElementById('modalAddUserStatus').innerHTML=''; document.getElementById('modalAddUser').classList.add('show'); }
async function doAddUser() {
  const u = document.getElementById('addUsername').value.trim();
  const n = document.getElementById('addName').value.trim();
  const p = document.getElementById('addPassword').value;
  const el = document.getElementById('modalAddUserStatus');
  if (!u) { el.innerHTML='<div class="status status-error">账号不能为空</div>'; return; }
  if (u.length>15) { el.innerHTML='<div class="status status-error">账号长度不能超过15位</div>'; return; }
  if (n.length>20) { el.innerHTML='<div class="status status-error">姓名长度不能超过20位</div>'; return; }
  if (p.length<6) { el.innerHTML='<div class="status status-error">密码长度不能少于6位</div>'; return; }
  try {
    const res = await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u, name:n||null, password:p})});
    const d = await res.json();
    if (!res.ok) { el.innerHTML='<div class="status status-error">'+(d.error||'创建失败')+'</div>'; return; }
    el.innerHTML='<div class="status status-success">账号创建成功！</div>';
    setTimeout(()=>{closeModal('modalAddUser');loadUserList();},800);
  } catch(_) { el.innerHTML='<div class="status status-error">网络异常</div>'; }
}

function openResetPwdModal(id, username, name) {
  currentResetUserId = id;
  document.getElementById('resetPwdUsername').textContent = username;
  document.getElementById('resetName').value = name || '';
  document.getElementById('resetPassword').value = '';
  document.getElementById('modalResetPwdStatus').innerHTML = '';
  document.getElementById('modalResetPwd').classList.add('show');
}
async function doResetPassword() {
  const n = document.getElementById('resetName').value.trim();
  const p = document.getElementById('resetPassword').value;
  const el = document.getElementById('modalResetPwdStatus');
  if (n.length>20) { el.innerHTML='<div class="status status-error">姓名长度不能超过20位</div>'; return; }
  if (p.length<6) { el.innerHTML='<div class="status status-error">密码长度不能少于6位</div>'; return; }
  try {
    const res = await fetch('/api/admin/users/'+currentResetUserId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p, name:n||null})});
    const d = await res.json();
    if (!res.ok) { el.innerHTML='<div class="status status-error">'+(d.error||'修改失败')+'</div>'; return; }
    el.innerHTML='<div class="status status-success">账号信息修改成功！</div>';
    setTimeout(()=>{closeModal('modalResetPwd');loadUserList();},800);
  } catch(_) { el.innerHTML='<div class="status status-error">网络异常</div>'; }
}

async function deleteUser(id) {
  if (!confirm('确定要删除该账号吗？')) return;
  try {
    const res = await fetch('/api/admin/users/'+id,{method:'DELETE'});
    const d = await res.json();
    if (!res.ok) { alert(d.error||'删除失败'); return; }
    loadUserList();
  } catch(_) { alert('网络异常'); }
}

async function changeMyPassword() {
  const oldPwd = document.getElementById('oldPwd').value;
  const newPwd = document.getElementById('newPwd').value;
  const el = document.getElementById('pwdChangeStatus');
  if (!oldPwd || !newPwd) { el.innerHTML='<div class="status status-error">请填写所有字段</div>'; return; }
  if (newPwd.length<6) { el.innerHTML='<div class="status status-error">新密码长度不能少于6位</div>'; return; }
  try {
    const res = await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({oldPassword:oldPwd,newPassword:newPwd})});
    const d = await res.json();
    if (!res.ok) { el.innerHTML='<div class="status status-error">'+(d.error||'修改失败')+'</div>'; return; }
    el.innerHTML='<div class="status status-success">密码修改成功！</div>';
    document.getElementById('oldPwd').value='';
    document.getElementById('newPwd').value='';
  } catch(_) { el.innerHTML='<div class="status status-error">网络异常</div>'; }
}
</script>
</body>
</html>
