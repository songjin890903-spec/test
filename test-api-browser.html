<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>API Test</title></head>
<body>
<pre id="output" style="background:#111;color:#0f0;padding:20px;font-size:13px;line-height:1.6;"></pre>
<script>
const log = (msg) => { document.getElementById('output').textContent += msg + '\n'; console.log(msg); };
const API = 'http://localhost:3006';

async function test() {
  log('=== Test 1: POST /api/auth/login ===');
  try {
    const t0 = Date.now();
    const r = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: 'admin', password: 'admin123' })
    });
    const ms = Date.now() - t0;
    const d = await r.json();
    log(`Status: ${r.status} Time: ${ms}ms`);
    log('Body: ' + JSON.stringify(d));
    if (r.headers.get('Set-Cookie')) log('Cookie: ' + r.headers.get('Set-Cookie'));
  } catch(e) { log('ERROR: ' + e.message); }

  log('\n=== Test 2: GET /api/auth/me (no session) ===');
  try {
    const r = await fetch(API + '/api/auth/me');
    const d = await r.json();
    log('Status: ' + r.status + ' Body: ' + JSON.stringify(d));
  } catch(e) { log('ERROR: ' + e.message); }
}

test();
</script>
</body>
</html>
